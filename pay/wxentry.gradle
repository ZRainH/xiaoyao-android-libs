/**
 * 编译期按宿主 applicationId 自动生成：
 *   {applicationId}.wxapi.WXPayEntryActivity
 *
 * 对本仓库内所有 application 模块自动 apply（见根 build.gradle），
 * 宿主无需手写 wxapi 类或 Manifest 注册。
 *
 * 外部工程接入 AAR 时，在 app/build.gradle 增加：
 *   apply from: 'path/to/wxentry.gradle'
 */
def capitalize = { String value ->
    value.length() <= 1 ? value.toUpperCase() : value.substring(0, 1).toUpperCase() + value.substring(1)
}

android.applicationVariants.configureEach { variant ->
    def appId = variant.applicationId
    def outDir = file("${project.buildDir}/generated/source/wxapi/${variant.name}")
    def taskName = "generateWxPayEntry${capitalize(variant.name)}"

    def generateTask = tasks.register(taskName) {
        group = "pay"
        description = "Generate ${appId}.wxapi.WXPayEntryActivity for ${variant.name}"
        inputs.property("applicationId", appId)
        outputs.dir(outDir)

        doLast {
            def packageName = "${appId}.wxapi"
            def packageDir = new File(outDir, packageName.replace('.', File.separator))
            packageDir.mkdirs()
            def sourceFile = new File(packageDir, "WXPayEntryActivity.java")
            sourceFile.text = """package ${packageName};

/**
 * Auto-generated by pay/wxentry.gradle — do not edit.
 */
public class WXPayEntryActivity extends com.xiaoyao.pay.wechat.WXPayEntryActivity {
}
"""
        }
    }

    android.sourceSets.named(variant.name).configure {
        java.srcDir(outDir)
    }

    tasks.configureEach { task ->
        if (task.name == "compile${capitalize(variant.name)}Kotlin"
                || task.name == "compile${capitalize(variant.name)}JavaWithJavac") {
            task.dependsOn(generateTask)
        }
    }
}
